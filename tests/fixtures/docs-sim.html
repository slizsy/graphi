<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Docs simulator</title>
<style>
  body { margin: 0; font: 14px system-ui; background: #f1f3f4; }
  #page { width: 640px; margin: 30px auto; background: #fff; min-height: 300px; position: relative; padding: 40px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  canvas { display: block; }
  .kix-cursor { position: absolute; }
  .kix-cursor-caret { position: absolute; width: 2px; height: 18px; background: #000; }
  .docs-texteventtarget-iframe { position: absolute; top: -10000px; width: 1px; height: 1px; }
</style>
</head>
<body>
<!--
  A stand-in for Google Docs' input architecture: the document is drawn on a
  canvas, keystrokes arrive through a hidden contenteditable inside
  iframe.docs-texteventtarget-iframe, and a DOM caret (.kix-cursor-caret) is
  moved after each edit. ?accept=textinput|keypress|input chooses which event
  the "editor" consumes, so the adapter's calibration can be exercised.
-->
<div id="page"><canvas id="c" width="640" height="300"></canvas><div class="kix-cursor"><div class="kix-cursor-caret"></div></div></div>
<iframe class="docs-texteventtarget-iframe" src="about:blank"></iframe>
<script>
  const accept = new URLSearchParams(location.search).get('accept') || 'textinput';
  const model = [];
  window.__docText = () => model.join('');
  window.__accept = accept;
  const ctx = document.getElementById('c').getContext('2d');
  const caret = document.querySelector('.kix-cursor-caret');
  function render() {
    ctx.clearRect(0, 0, 640, 300);
    ctx.font = '15px system-ui';
    ctx.fillStyle = '#111';
    let x = 0, y = 18;
    for (const ch of model) {
      if (ch === '\n') { x = 0; y += 22; continue; }
      ctx.fillText(ch, x, y);
      x += ctx.measureText(ch).width;
      if (x > 620) { x = 0; y += 22; }
    }
    caret.style.left = `${40 + x}px`;
    caret.style.top = `${40 + y - 14}px`;
  }
  const frame = document.querySelector('iframe');
  const doc = frame.contentDocument;
  doc.body.innerHTML = '<div contenteditable="true"></div>';
  const target = doc.querySelector('[contenteditable]');
  target.focus();
  target.addEventListener('keydown', (e) => {
    if (e.keyCode === 8) { model.pop(); render(); e.preventDefault(); }
    if (e.keyCode === 13) { model.push('\n'); render(); e.preventDefault(); }
  });
  if (accept === 'keypress') {
    target.addEventListener('keypress', (e) => {
      if (e.charCode && e.charCode !== 13) { model.push(String.fromCodePoint(e.charCode)); render(); e.preventDefault(); }
    });
  } else if (accept === 'textinput') {
    target.addEventListener('textInput', (e) => { model.push(e.data); render(); e.preventDefault(); });
  } else if (accept === 'input') {
    target.addEventListener('beforeinput', (e) => {
      if (e.inputType === 'insertText') { model.push(e.data); render(); e.preventDefault(); }
    });
  }
  render();
</script>
</body>
</html>
